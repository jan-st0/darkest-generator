# DARKEST DUNGEON: CORE SYSTEM REFERENCE & COMPENDIUM
sys_rules:
  turn_order: "Base SPD + 1d8 (highest acts first)"
  acc_calc: "Hit% = Skill ACC + Mods + 5 (hidden) - Enemy DODGE; 95% displayed = 100% true hit; misses grant +4 ACC stack"
  crit_mech:
    atk: "1.5x Max DMG, +2 turns to Blight/Bleed, class self-buff, -3 Stress to self, 25% chance -3 Stress to allies"
    heal: "2x HP healed, -4 Stress to target"
  prot: "Direct DMG % reduction (excludes DoT); hard-capped at 80%"
  stress: "100 = Resolve Check (Affliction/Virtue); 200 = Heart Attack (HP to 0 or Deathblow check)"
  death_door: "0 HP triggers debuffs; subsequent hits trigger DeathBlow check; permadeath"
  skills_loadout: "4/7 combat + 4/7 camping (Abomination dynamically accesses all combat skills by form)"

