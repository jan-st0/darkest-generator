    base_stats:
      level_0: { hp: 27, dodge: 0.0, spd: 3, crit: "6.0%", base_dmg: "4–8" }
      level_6: { hp: 47, dodge: 20.0, spd: 5, crit: "10.0%", base_dmg: "7–14" }
    combat_skills:
