        target_mode: "Cleave"
        type: "Ranged"
        effects: "ACC 95–115, DMG -80%, CRIT -10% to -6%, Debuffs -15 to -20 ACC (100% to 140% base), -15% to -19% CRIT (100% to 140% base) (2 rds)"
      - name: "Sniper's Mark"
        launch_rank: [4, 3, 2, 1]
        target_rank: [2, 3, 4]
        type: "Ranged"
        effects: "ACC 100–120, DMG -100%, Mark Target (3 rds), Debuffs -20 to -30 DODGE (100% to 140% base, 2 rds)"
