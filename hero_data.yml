  flagellant:
    overview: "High-risk frontline bleed/support (Rank 1–2). Powers spike below 50% HP or at Death's Door. Transmutates ally stress and DoTs to himself; party heal/stun on death."
    special_mechanics: "Frontline bleed-based martyr restricted to position 1 or 2 for attacks, with powerful support from any rank. Thrives at low health (<40% HP buffs DMG/CRIT, enables emergency heals Redeem/Exsanguinate) and Death's Door (heals party, gains massive buffs). Cannot gain virtues; always becomes Rapturous (+25% DMG, +3 SPD, -20 DODGE) at 100 Stress. Will only use Penance Hall in town. Refuses to party with other Flagellants."
    religious: true
    base_stats:
      level_0: { hp: 22, dodge: 0.0, spd: 6, crit: "2.0%", base_dmg: "3–6" }
      level_6: { hp: 38, dodge: 20.0, spd: 9, crit: "6.0%", base_dmg: "5–11" }
    combat_skills:
      - name: "Punish"
        launch_rank: [2, 1]
        target_rank: [1, 2]
        type: "Melee"
        effects: "ACC 95–115, DMG +0%, CRIT 5%–9%, Bleed (4 to 6 pts/rd for 3 rds, 100% to 140% base), Debuff target: -20% to -33% Bleed Resist (100% to 140% base, 3 rds)"
      - name: "Rain of Sorrows"
        launch_rank: [2, 1]
        target_rank: [3, 4]
        target_mode: "Cleave"
        type: "Melee"
        effects: "ACC 95–115, DMG -67%, CRIT 2%–6%, Bleed (3 to 5 pts/rd for 3 rds, 100% to 140% base), Debuff target: -20% to -33% Bleed Resist (100% to 140% base, 3 rds)"
      - name: "Exsanguinate"
        launch_rank: [2, 1]
        target_rank: [1, 2]
        type: "Melee"
        effects: "ACC 90–110, DMG +0%, CRIT 3%–7%, Bleed (5 to 9 pts/rd for 3 rds, 100% to 140% base), Self: Heal 35% to 50% max HP, Self-debuff: -25% Healing Skills, -25% Healing Received, -3 SPD (3 rds) (Limit: 3 Uses per Battle, Only usable below 40% HP)"
      - name: "Reclaim"
        launch_rank: [4, 3, 2, 1]
        target_rank: [4, 3, 2, 1]
        type: "Heal"
        effects: "Restoration (Heal 2 pts/rd for 2 rds to Heal 4 pts/rd for 3 rds), Self-bleed: (3 pts/rd for 3 rds to 5 pts/rd for 3 rds, 120% to 160% base)"
      - name: "Redeem"
        launch_rank: [4, 3, 2, 1]
        target_rank: [4, 3, 2, 1]
        type: "Heal"
        effects: "Heal Target (33% to 43% max HP), Self: Heal 35% to 50% max HP, Self-debuff: -25% Healing Skills, -25% Healing Received, -3 SPD (3 rds) (Limit: 2 Uses per Battle, Only usable below 40% HP)"
      - name: "Endure"
        launch_rank: [4, 3, 2, 1]
        target_rank: [4, 3, 2, 1]
        type: "Heal"
        effects: "Stress Heal Target (-10 to -14 Stress), Self: Stress +10 to +6, Self-buff: +1 to +3 SPD (4 rds)"
      - name: "Suffer"
        launch_rank: [4, 3, 2, 1]
        target_rank: [4, 3, 2, 1]
        type: "Buff"
        effects: "Clear Marked, Blight, and Bleed on Target and transfer them to Self. Self: Mark Self (2 rds), Debuff: -20% to -40% Stress (4 rds), Buff: +6% to +10% Death Blow Resist (4 rds)"
    camping_skills:
      - { name: "Lash's Anger", cost: 1, target: "Self", effects: "+40 Stress." }
      - { name: "Lash's Solace", cost: 3, target: "Self", effects: "-50 Stress." }
      - { name: "Lash's Kiss", cost: 3, target: "Self", effects: "Heal 33% HP, Remove Bleeding/Blight, +3 SPD (4 Battles)." }
      - { name: "Lash's Cure", cost: 2, target: "Self", effects: "Remove Disease." }

