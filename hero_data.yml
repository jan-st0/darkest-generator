        type: "Heal"
        effects: "Heal 1-1 to 3-3 HP, +10% to +15% Bleed & Blight Resist (3 rds)"
      - name: "Invigorating Vapours"
        launch_rank: [4, 3]
        target_rank: "All Allies"
        type: "Buff"
        effects: "+3 to +10 DODGE to entire party (3 rds)"
      - name: "Protect Me!"
        launch_rank: [4, 3, 2, 1]
        target_rank: [1, 2, 3, 4]
        type: "Buff"
        effects: "Forces Ally Guard (2 rds), Target +4 to +8 DODGE, +10% to +20% PROT, Marks Target (3 Uses/Battle)"
    camping_skills:
      - { name: "Resupply", cost: 1, target: "Self", effects: "Produces a random supply item (3 uses)." }
      - { name: "Trinket Scrounge", cost: 2, target: "Self", effects: "Produces a random common–rare trinket." }
      - { name: "Strange Powders", cost: 2, target: "One Companion", effects: "+20% Bleed/Blight/Move/Debuff/Disease Resist (4 battles)." }
      - { name: "Curious Incantation", cost: 1, target: "Self", effects: "-50% Stress received (4 battles)." }

  arbalest:
