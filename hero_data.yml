    camping_skills:
      - { name: "Field Dressing", cost: 2, target: "One Companion", effects: "Heal 35% HP (75% chance) or 50% HP (25% chance), Removes Bleeding." }
      - { name: "Marching Plan", cost: 3, target: "All Companions", effects: "+2 SPD (4 battles)." }
      - { name: "Restring Crossbow", cost: 3, target: "Self", effects: "+10 ACC, +20% DMG, +8% CRIT to Ranged Skills; -2 SPD (4 battles)." }
      - { name: "Triage", cost: 3, target: "All Companions", effects: "Heal 20% HP." }

  bounty_hunter:
