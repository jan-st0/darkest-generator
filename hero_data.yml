        type: "Ranged"
        effects: "ACC 75–95, DMG -10%, CRIT 0%–4%, Self-buff +3 to +5 SPD (4 rds), hits random enemy"
      - name: "Battlefield Bandage"
        launch_rank: [4, 3]
        target_rank: [4, 3, 2, 1]
        type: "Heal"
        effects: "Heal 2–3 to 4–5 HP, Target +20% to +38% Healing Received (3 rds)"
      - name: "Rallying Flare"
