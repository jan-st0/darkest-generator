heroes:
  abomination:
    overview: "Shape-shifter. Human form provides stuns, blights, and self-sustain (Rank 2–3). Beast form provides high frontline melee damage (Rank 1–2) but inflicts stress on teammates upon transformation. Starts with all combat skills unlocked."
    special_mechanics: "Uses dynamic form transformation (Free Action). Transforming to Beast inflicts +8 Stress to allies; transforms back on Affliction, victory, or manual cancel (inflicts +6 Stress/turn while active)."
    religious: false
    base_stats:
      level_0: { hp: 26, dodge: 7.5, spd: 7, crit: "2.0%", base_dmg: "6–11" }
      level_6: { hp: 46, dodge: 27.5, spd: 9, crit: "6.0%", base_dmg: "11–20" }
    combat_skills:
      - name: "Transform (to Beast)"
        form: "Human"
        launch_rank: [4, 3, 2, 1]
        target_rank: "Self"
        type: "Free Action"
        effects: "Self-heal 5–10 HP, +1 to +5 SPD, +10% to +25% DMG, +20% to +30% Blight Resist, +8 Stress to Allies (1 use/battle)"
      - name: "Manacles"
        form: "Human"
        launch_rank: [3, 2]
        target_rank: [1, 2, 3]
        type: "Ranged"
        effects: "ACC 95–115, DMG -60%, CRIT 1%–5%, Stun (90%–130% base)"
      - name: "Beast's Bile"
        form: "Human"
        launch_rank: [3, 2]
        target_rank: [2, 3]
        target_mode: "Cleave"
        type: "Ranged"
        effects: "ACC 95–115, DMG -90%, Blight (2–5 pts/rd for 3 rds), -20% to -33% Blight Resist"
      - name: "Absolution"
        form: "Human"
        launch_rank: [4, 3, 2, 1]
        target_rank: "Self"
        type: "Heal"
        effects: "Heal 3–5 HP, -7 to -10 Stress heal"
      - name: "Transform (to Human)"
        form: "Beast"
        launch_rank: [4, 3, 2, 1]
        target_rank: "Self"
        type: "Buff"
        effects: "Revert form, -2 Stress to Allies, -4 to -0 SPD debuff (1 use/battle)"
      - name: "Rake"
        form: "Beast"
        launch_rank: [2, 1]
        target_rank: [1, 2]
        target_mode: "Cleave"
        type: "Melee"
        effects: "ACC 90–110, DMG -50%, CRIT -3% to +1%, Self-buff (+15% to +25% Rake DMG, stacks, 4 rds)"
      - name: "Rage"
        form: "Beast"
        launch_rank: [2, 1]
        target_rank: [1, 2, 3]
        type: "Melee"
        effects: "ACC 85–105, DMG +0%, CRIT 7.5%–11.5%"
      - name: "Slam"
        form: "Beast"
        launch_rank: [3, 2, 1]
        target_rank: [1, 2]
        type: "Melee"
        effects: "ACC 80–100, DMG -25%, Forward 1, Knockback 2, -10 to -20 DODGE, -2 to -6 SPD debuff"
    camping_skills:
      - { name: "Anger Management", cost: 3, target: "Self & All Allies", effects: "Self: +20 Stress; All Allies: -10 Stress." }
      - { name: "Psych Up", cost: 3, target: "Self & Allies", effects: "Self: +25% DMG (4 battles); Non-religious allies +10 Stress, Religious allies +20 Stress." }
      - { name: "The Quickening", cost: 3, target: "Self", effects: "Self: +4 SPD (4 battles)." }
      - { name: "Eldritch Blood", cost: 3, target: "Self", effects: "Self: +40% Blight/Bleed/Disease Resist, +20% Stress received (4 battles)." }

  antiquarian:
    overview: "Low combat stats; utility/support role. Increases gold stack limits per inventory slot and discovers bonus Antiques for selling. Provides party Dodge buffs, weak heals, and force-guard skills."
    special_mechanics: "Increases gold capacity by +750 per stack (+15% Shards in Farmstead). Interacting with curios yields Minor (500g, stack of 20) or Rare (1250g, stack of 5) Antiques."
    religious: false
    base_stats:
      level_0: { hp: 17, dodge: 10.0, spd: 5, crit: "1.0%", base_dmg: "3–5" }
      level_6: { hp: 29, dodge: 30.0, spd: 7, crit: "5.0%", base_dmg: "5–9" }
    combat_skills:
