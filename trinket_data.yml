core_mechanics:
  turn_order: "Determined each round by Base SPD + Random(1-8). Highest acts first."
  accuracy: "Hit Chance % = Skill Base ACC + Modifiers + 5 (Hidden) - Enemy DODGE. Displayed 95% is a guaranteed hit (100%). Each consecutive miss adds +4 ACC."
  critical_hit: "Deals 1.5 × Max Damage, extends Blight/Bleed by 2 turns, grants a class-specific self-buff, heals 3 Stress to the attacker, and gives a 25% chance to heal 3 Stress to allies. Critical heals double HP restored and relieve 4 Stress."
  protection: "Reduces direct damage by percentage. Does not reduce Bleed or Blight damage. Hard-capped at 80%."
  stress_and_affliction: "At 100 Stress, a hero tests resolve (Affliction or Virtue). At 200 Stress, a Heart Attack occurs, dropping HP to 0 (or causing death if already at Death's Door)."
  deaths_door: "Reaching 0 HP puts a hero on Death's Door (inflicting debuffs). Any subsequent damage requires a DeathBlow check. Death is permanent; trinkets drop upon party victory."
  skill_limits: "Heroes equip 4 out of 7 combat skills and 4 out of 7 camping skills (Abomination has all combat skills available dynamically based on form)."

